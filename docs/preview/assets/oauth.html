<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>카카오 연결 코드</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:24px 16px;line-height:1.7}code{display:block;word-break:break-all;padding:12px;background:#eef3f0;border-radius:8px;font-size:15px}</style></head>
<body><h1>카카오 연결 코드</h1><p>아래 코드를 복사해 Claude에게 보내 주세요. 10분 안에 써야 합니다.</p><code id="c">코드가 없습니다.</code>
<script>var p=new URLSearchParams(location.search);var c=p.get('code')||('오류: '+(p.get('error_description')||p.get('error')||'코드 없음'));document.getElementById('c').textContent=c;history.replaceState(null,'',location.pathname);</script></body></html>
